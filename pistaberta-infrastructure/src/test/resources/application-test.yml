spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed,classpath:db/test
  datasource:
    hikari:
      # Cada clase de test con su @DynamicPropertySource crea su propio contexto: sin pool pequeño se agotan
      # las conexiones del Postgres de test (max_connections=100).
      maximum-pool-size: 4
      minimum-idle: 1
