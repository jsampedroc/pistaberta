# NOTA: este workflow existe en ci-shared desde v2.2.0; en un @v2 anterior el caller falla.
# >>> COPIA ESTE FICHERO a  .github/workflows/metodo.yml  en cada proyecto <<<
# Gate del método: P1 sin Closes/Fixes/Resolves en commits · P2 línea «Origen:» en el cuerpo del
# PR · P3 «<!-- metodo: vN -->» en ./CLAUDE.md · P4 docs/decisiones.md parseable (si el PR lo toca).
# P2 no se exige a Dependabot (actor dependabot[bot] Y rama dependabot/*); P1, P3 y P4 sí.
name: Método

on:
  pull_request:
    branches: [main]   # base de integración de este repo (CLAUDE.md)
    # `edited` es lo que hace que corregir el cuerpo del PR (P2: «Origen:») relance el gate.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  metodo:
    uses: jsampedroc/ci-shared/.github/workflows/metodo.yml@v2
    with:
      # AJUSTA: true (por defecto) bloquea el merge ante una violación. false = la informa y sale
      # en verde, para adoptar el gate en un repo que aún no cumple; vuelve a true cuando cumpla.
      fail_on_violations: true
      runner: pistaberta   # etiqueta del runner self-hosted de este repo (como en ci.yml, CI_RUNNER=pistaberta)
